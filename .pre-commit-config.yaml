# The hooks call the same make targets as CI, so the versions come from
# uv.lock and the Makefile, not from a second list here.
repos:
  - repo: local
    hooks:
      - id: lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
        files: \.py$
