# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Every gate in `make check`, plus what needs a clean runner: the OS and
# Python matrix, the README Quick Start, the staged install, the dev
# container and the external link check. "validate" is the required check.

name: CI

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, complexity, docs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make lint (ruff, complexity, check_docs, codespell, REUSE, markdownlint, actionlint)
        run: make lint

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.15"]
        # The next Python, pre-release: an early warning that does not
        # block a merge, since an alpha can break for reasons not ours.
        include:
          - os: ubuntu-latest
            python-version: "3.16"
            prerelease: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.prerelease == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests with the coverage gate
        run: make test
      - name: Fuzz corpus replay and property tests
        run: make fuzz

  fuzz:
    name: Coverage-guided fuzzing (Atheris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: Fuzz from the seed corpus
        run: make fuzz-atheris

  floor:
    name: Python 3.9 floor, end to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Smoke test on Python 3.9 (standard library only)
        run: |
          uv python install 3.9
          make smoke PYTHON="$(uv python find 3.9)"

  docs:
    name: Manual (strict build) and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: Build the manual and API reference (mkdocstrings) with warnings as errors
        run: make docs
      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --version
      - name: Check every link (make linkcheck, lychee.toml)
        run: make linkcheck

  api:
    name: API breakage since the last release (griffe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: make api

  supply-chain:
    name: Advisory audit, SBOM, reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: pip-audit over uv.lock
        run: make audit
      - name: CycloneDX SBOM
        run: make sbom
      - name: Build twice, compare (reproducible)
        run: make reproducible

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  install:
    name: Staged install, README Quick Start
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: make DESTDIR=stage install
        run: |
          make DESTDIR="$RUNNER_TEMP/stage" install
          for f in bin/standards-sync share/man/man1/standards-sync.1 \
                   share/bash-completion/completions/standards-sync \
                   share/zsh/site-functions/_standards-sync \
                   share/fish/vendor_completions.d/standards-sync.fish; do
            test -s "$RUNNER_TEMP/stage/usr/local/$f" || { echo "missing $f"; exit 1; }
          done
          "$RUNNER_TEMP/stage/usr/local/bin/standards-sync" --help
      - name: Run the README Quick Start as written
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          awk '/^## Quick Start/{f=1} f && /^```bash/{c=1; next} c && /^```/{exit} c' README.md > "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
          bash -euo pipefail "$RUNNER_TEMP/quickstart.sh"

  packages-linux:
    name: Packages build and install (deb, rpm, Arch)
    runs-on: ubuntu-latest
    env:
      FEDORA: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
      ARCH: archlinux:latest@sha256:375a401bb3c6376b37f40b6dfa25067db37ec78d0b7af67ae6315f43a0184a9d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: make pkg
        run: make pkg
      - name: Debian package, installed with apt
        run: |
          root="$(echo build/pkg/deb/standards-sync_*_all)"
          dpkg-deb --root-owner-group --build "$root" "$root.deb"
          sudo apt-get install -y "./$root.deb"
          standards-sync --help
          man -w standards-sync
          sudo apt-get remove -y standards-sync
      - name: RPM, built and installed on Fedora
        run: |
          docker run --rm -v "$PWD/build/pkg:/pkg" "$FEDORA" bash -euxc '
            dnf -y -q install rpm-build
            mkdir -p ~/rpmbuild/SOURCES && cp /pkg/*-unix.tar.gz ~/rpmbuild/SOURCES/
            rpmbuild -bb /pkg/rpm/standards-sync.spec
            dnf -y -q install ~/rpmbuild/RPMS/noarch/standards-sync-*.rpm
            standards-sync --help
            rpm -ql standards-sync'
      - name: Arch package, built with makepkg and installed
        run: |
          docker run --rm -v "$PWD/build/pkg:/pkg" "$ARCH" bash -euxc '
            pacman -Syu --noconfirm --needed -q base-devel git python
            useradd -m builder
            cp -r /pkg/aur /home/builder/aur && cp /pkg/*-unix.tar.gz /home/builder/aur/
            chown -R builder /home/builder/aur
            su builder -c "cd ~/aur && makepkg --noconfirm && makepkg --printsrcinfo > generated.SRCINFO"
            diff -u /home/builder/aur/.SRCINFO /home/builder/aur/generated.SRCINFO
            pacman -U --noconfirm /home/builder/aur/standards-sync-*.pkg.tar.zst
            standards-sync --help'

  packages-brew:
    name: Homebrew formula, installed and tested
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: make pkg, with the tarball served from disk
        run: make pkg URL_BASE="file://$PWD/build/pkg"
      - name: brew install and brew test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap-new --no-git local/pkgtest
          cp build/pkg/brew/standards-sync.rb "$(brew --repository)/Library/Taps/local/homebrew-pkgtest/Formula/"
          brew install local/pkgtest/standards-sync
          brew test local/pkgtest/standards-sync
          standards-sync --help

  packages-nix:
    name: Nix expression, built against nixpkgs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: make pkg
        run: make pkg
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          # nixos-26.05, pinned by commit
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/0dc498bfe49baeb18b0f9891e800b53bb2603193.tar.gz
      - name: nix-build package.nix (from the sdist, tests included)
        run: |
          # This version's sdist is not on PyPI before the tag; add it to
          # the store under its hash so fetchPypi finds it there.
          nix-store --add-fixed sha256 build/pkg/sdist/standards_sync-*.tar.gz
          nix-build -E 'with import <nixpkgs> { }; callPackage ./build/pkg/nix/package.nix { }'
          ./result/bin/standards-sync --help
          test -s result/share/man/man1/standards-sync.1.gz
          test -s result/share/zsh/site-functions/_standards-sync

  devcontainer:
    name: Dev container boots to make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: make test

  validate:
    name: validate
    if: always()
    needs: [lint, test, fuzz, floor, docs, api, supply-chain, dependency-review, install, packages-linux, packages-brew, packages-nix, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          print(bad or "all jobs passed")
          sys.exit(1 if bad else 0)'
